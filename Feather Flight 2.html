<style>
/* Layout: the sky canvas fills the whole screen. The 9:16 play field is scaled to fit and sits on the bottom edge,
   so any extra room (wide or tall screens) is filled with sky, clouds, hills and ground. */
:root {
  --sky: #5cbeff;
  --bg: #080c26;
  --ink: #f6f3ff;
  --mute: #aeb4e6;
  --panel: rgba(10, 15, 46, 0.8);
  --line: rgba(255, 255, 255, 0.18);
  --gold: #ffc233;
  --goldink: #2a1d00;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas#c { position: fixed; left: 0; top: 0; display: block; }
#dim { position: fixed; inset: 0; pointer-events: none; }
.stage { position: fixed; pointer-events: none; width: 360px; height: 640px; left: 0; top: 0; }
.ov { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 0.3em solid #fff; outline-offset: 0.2em; }
.btn {
  border: 0; border-radius: 1.2em; padding: 0.9em 1.4em; font-family: var(--display);
  font-size: 2em; letter-spacing: 0.02em; background: rgba(255, 255, 255, 0.14); color: var(--ink);
  box-shadow: inset 0 0 0 0.1em var(--line);
}
.btn.primary { background: var(--gold); color: var(--goldink); box-shadow: 0 0.35em 0 #b8841a; }
.btn.primary:active { transform: translateY(0.25em); box-shadow: 0 0.1em 0 #b8841a; }
.menu { justify-content: space-between; padding: calc(5em + env(safe-area-inset-top, 0px)) 2em calc(2.4em + env(safe-area-inset-bottom, 0px)); }
.menu h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 6.4em; line-height: 0.98; text-align: center; color: #fff; text-shadow: 0 0.06em 0 #2a3a99, 0 0.14em 0.4em rgba(0, 0, 0, 0.4); letter-spacing: 0.01em; }
.menu .sub { margin: 0.8em auto 0; max-width: 20em; text-align: center; font-weight: 800; font-size: 1.5em; color: #e2e6ff; text-shadow: 0 0.1em 0.3em rgba(0, 0, 0, 0.5); }
.bottom { display: flex; flex-direction: column; gap: 1.2em; align-items: stretch; }
.colorbtn { display: flex; align-items: center; gap: 0.9em; width: 100%; border: 0; border-radius: 1.2em; padding: 0.5em 1em 0.5em 0.6em; background: var(--panel); box-shadow: inset 0 0 0 0.12em var(--line); text-align: left; }
.colorbtn canvas { width: 4.4em; height: 4.4em; flex: none; }
.colorbtn .lbl { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.colorbtn small { font-size: 1.2em; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: 0.1em; }
.colorbtn b { font-family: var(--display); font-weight: 400; font-size: 2.2em; line-height: 1.1; }
.colorbtn .chev { font-size: 2.6em; line-height: 1; color: var(--mute); }
.pick { justify-content: center; align-items: center; padding: 0 1.4em; }
.pick .card { width: 100%; gap: 1.2em; padding: 1.8em 1.2em 1.4em; }
.pick h2 { font-size: 3.4em; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6em; width: 100%; }
.sw { border: 0; border-radius: 1em; padding: 0.3em 0 0.4em; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 0.1em var(--line); display: flex; flex-direction: column; align-items: center; min-width: 0; }
.sw canvas { width: 4.6em; height: 4.6em; }
.sw span { font-size: 1.15em; font-weight: 800; color: var(--mute); }
.sw[aria-checked="true"] { box-shadow: inset 0 0 0 0.2em var(--gold); background: rgba(255, 194, 51, 0.12); }
.sw[aria-checked="true"] span { color: var(--ink); }
.seg { display: flex; background: var(--panel); border-radius: 1.2em; padding: 0.3em; box-shadow: inset 0 0 0 0.1em var(--line); }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 0.9em; padding: 0.7em 0; font-weight: 800; font-size: 1.6em; color: var(--mute); }
.seg button[aria-checked="true"] { background: var(--gold); color: var(--goldink); }
.meta { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.5em; color: #e2e6ff; text-shadow: 0 0.1em 0.3em rgba(0, 0, 0, 0.6); }
.link { background: none; border: 0; padding: 0.3em 0; font-weight: 800; font-size: 1em; color: #e2e6ff; text-decoration: underline; text-underline-offset: 0.2em; }
.pbtn { position: absolute; pointer-events: auto; top: calc(1.4em + env(safe-area-inset-top, 0px)); left: 1.4em; width: 4.4em; height: 4.4em; border-radius: 50%; border: 0; background: var(--panel); box-shadow: inset 0 0 0 0.12em var(--line); display: flex; gap: 0.5em; align-items: center; justify-content: center; }
.pbtn i { display: block; width: 0.55em; height: 1.8em; background: #fff; border-radius: 0.2em; }
.over, .pause { align-items: center; justify-content: center; }
.card { width: 27em; background: var(--panel); border-radius: 2em; padding: 2.4em 2em 2em; box-shadow: inset 0 0 0 0.12em var(--line), 0 1.6em 4em rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; gap: 1.4em; backdrop-filter: blur(6px); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 3.8em; line-height: 1; }
.medal { width: 8.4em; height: 8.4em; border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 1.9em; color: rgba(0, 0, 0, 0.62); box-shadow: inset 0 0 0 0.35em rgba(255, 255, 255, 0.35), 0 0.3em 0 rgba(0, 0, 0, 0.3); }
.medal.m0 { background: rgba(255, 255, 255, 0.08); color: var(--mute); box-shadow: inset 0 0 0 0.1em var(--line); font-family: var(--body); font-weight: 800; font-size: 1.25em; padding: 0 1.2em; }
.medal.m1 { background: radial-gradient(circle at 35% 30%, #f3bd8a, #a8642a); }
.medal.m2 { background: radial-gradient(circle at 35% 30%, #f4f8fc, #98a5b4); }
.medal.m3 { background: radial-gradient(circle at 35% 30%, #ffe27a, #e09a10); }
.medal.m4 { background: radial-gradient(circle at 35% 30%, #d9fbff, #4cc7e6); }
.stats { display: flex; gap: 3em; }
.stats div { display: flex; flex-direction: column; align-items: center; }
.stats span { font-weight: 800; font-size: 1.3em; color: var(--mute); text-transform: uppercase; letter-spacing: 0.12em; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 4.2em; line-height: 1.1; }
.tag { margin: -0.4em 0 0; font-family: var(--display); font-size: 1.9em; color: var(--gold); }
.btns { display: flex; flex-direction: column; gap: 0.9em; width: 100%; }
@media (prefers-reduced-motion: reduce) { .btn.primary:active { transform: none; } }
</style>

<canvas id="c"></canvas>
<div id="dim"></div>

<div class="stage" id="stage">
  <button class="pbtn" id="pauseBtn" aria-label="Pause" hidden><i></i><i></i></button>

  <section class="ov menu" id="menu">
    <div>
      <h1>Feather<br>Flight</h1>
      <p class="sub">Flap between the pillars and see how far you can get.</p>
    </div>
    <div class="bottom">
      <button class="colorbtn" id="colorBtn" type="button" aria-haspopup="dialog">
        <canvas id="curBird" width="88" height="88"></canvas>
        <span class="lbl"><small>Bird color</small><b id="curName">Yellow</b></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <div class="seg" id="diffs" role="radiogroup" aria-label="Difficulty"></div>
      <button class="btn primary" id="play">Play</button>
      <div class="meta"><span id="bestLine"></span><button class="link" id="snd" type="button"></button></div>
    </div>
  </section>

  <section class="ov pick" id="pick" hidden role="dialog" aria-label="Bird color">
    <div class="card">
      <h2>Bird color</h2>
      <div class="grid" id="grid" role="radiogroup" aria-label="Bird color"></div>
      <div class="btns"><button class="btn primary" id="pickDone">Done</button></div>
    </div>
  </section>

  <section class="ov over" id="over" hidden>
    <div class="card">
      <h2>Game over</h2>
      <div class="medal m0" id="medal"></div>
      <div class="stats">
        <div><span>Score</span><b id="sc">0</b></div>
        <div><span>Best</span><b id="bs">0</b></div>
      </div>
      <p class="tag" id="newTag" hidden>New best!</p>
      <div class="btns">
        <button class="btn primary" id="again">Play again</button>
        <button class="btn" id="toMenu">Menu</button>
      </div>
    </div>
  </section>

  <section class="ov pause" id="pause" hidden>
    <div class="card">
      <h2>Pause</h2>
      <div class="btns">
        <button class="btn primary" id="resume">Resume</button>
        <button class="btn" id="quit">Menu</button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var W = 360, H = 640, GH = 84, GY = H - GH, PW = 62, BX = 96, BR = 12;
  var GRAV = 0.42, FLAP = 7.3;
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
  var stage = $('stage'), dim = $('dim');
  // Extra world units visible beside / above the 360x640 play field (0 on a 9:16 screen).
  var view = { s: 1, d: 1, left: 0, top: 0, exL: 0, exR: 0, exT: 0 };

  // The 16 basic colors. Belly, wing, beak and outline are derived from the body color.
  var BASIC = [
    ['White', '#ffffff'], ['Silver', '#c0c0c0'], ['Gray', '#808080'], ['Black', '#000000'],
    ['Red', '#ff0000'], ['Maroon', '#800000'], ['Yellow', '#ffff00'], ['Olive', '#808000'],
    ['Lime', '#00ff00'], ['Green', '#008000'], ['Aqua', '#00ffff'], ['Teal', '#008080'],
    ['Blue', '#0000ff'], ['Navy', '#000080'], ['Fuchsia', '#ff00ff'], ['Purple', '#800080']
  ];
  var CHARS = BASIC.map(function (b) {
    var c = [parseInt(b[1].substr(1, 2), 16), parseInt(b[1].substr(3, 2), 16), parseInt(b[1].substr(5, 2), 16)];
    var lum = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
    var wing = lum > 0.35 ? mix(c, [0, 0, 0], 0.28) : mix(c, [255, 255, 255], 0.3);
    var belly = lum > 0.9 ? mix(c, [0, 0, 0], 0.1) : mix(c, [255, 255, 255], lum < 0.2 ? 0.55 : 0.6);
    return {
      n: b[0], body: b[1], belly: rgb(belly), wing: rgb(wing),
      beak: lum < 0.5 ? '#ffc233' : '#ff8a1f',
      line: lum < 0.25 ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.28)'
    };
  });
  var DIFFS = [
    { n: 'Easy', gap: 178, sp: 1.9, sd: 230, move: false },
    { n: 'Normal', gap: 152, sp: 2.3, sd: 210, move: false },
    { n: 'Hard', gap: 134, sp: 2.7, sd: 200, move: true }
  ];
  var MEDALS = ['', 'Bronze', 'Silver', 'Gold', 'Platinum'];
  var PH = [
    { top: [92, 190, 255], bot: [196, 238, 255], hill: [118, 200, 160], cloud: [255, 255, 255], pillar: [74, 150, 120], pdark: [40, 100, 80], ground: [226, 200, 144], gtop: [120, 190, 80], stars: 0 },
    { top: [84, 58, 140], bot: [255, 154, 122], hill: [122, 72, 124], cloud: [255, 206, 196], pillar: [156, 92, 124], pdark: [96, 52, 84], ground: [150, 102, 104], gtop: [112, 82, 112], stars: 0.25 },
    { top: [10, 16, 44], bot: [36, 46, 104], hill: [26, 36, 84], cloud: [62, 78, 132], pillar: [62, 92, 152], pdark: [34, 54, 110], ground: [40, 50, 92], gtop: [62, 82, 142], stars: 1 }
  ];

  // ---------- Storage ----------
  var store = { best: [0, 0, 0], ch: 6, df: 1, snd: true, v: 0 };
  try {
    var raw = localStorage.getItem('federflug-v1');
    if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') { for (var k in o) store[k] = o[k]; } }
  } catch (e) {}
  if (!Array.isArray(store.best) || store.best.length < 3) store.best = [0, 0, 0];
  if (store.v !== 2) { store.ch = 6; store.v = 2; }
  if (typeof store.ch !== 'number' || store.ch < 0 || store.ch > 15) store.ch = 6;
  function save() { try { localStorage.setItem('federflug-v1', JSON.stringify(store)); } catch (e) {} }

  // ---------- Sound ----------
  var ac = null;
  function ensureAudio() {
    if (ac || !store.snd) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(f1, f2, dur, type, vol) {
    if (!store.snd || !ac) return;
    try {
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }

  // ---------- Colors ----------
  function rgb(a, al) { return 'rgba(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ',' + (al == null ? 1 : al) + ')'; }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function clonePal(p) { var c = {}; for (var k in p) c[k] = Array.isArray(p[k]) ? p[k].slice() : p[k]; return c; }
  function lerpPal(c, t, k) {
    for (var key in t) {
      if (Array.isArray(t[key])) { for (var i = 0; i < 3; i++) c[key][i] += (t[key][i] - c[key][i]) * k; }
      else c[key] += (t[key] - c[key]) * k;
    }
  }
  var cur = clonePal(PH[0]);

  // ---------- State ----------
  var state = 'menu', prevState = 'ready';
  var t = 0, score = 0, shake = 0, deadAt = 0, isNew = false, groundOff = 0;
  var bird = { y: 300, vy: 0, rot: 0, flapT: 0 };
  var pipes = [], parts = [], clouds = [], stars = [];
  var D = DIFFS[store.df];
  for (var j = 0; j < 90; j++) stars.push({ u: Math.random(), v: Math.random(), r: 0.6 + Math.random() * 1.4, p: Math.random() * 6 });

  function visW() { return W + view.exL + view.exR; }
  function newCloud(x) {
    return { x: x, y: -view.exT + 30 + Math.random() * (view.exT + 270), s: 0.6 + Math.random() * 0.9, sp: 0.15 + Math.random() * 0.25 };
  }
  var seededArea = 0;
  function seedClouds() {
    var area = visW() * (view.exT + 300);
    if (area <= seededArea * 1.01) return;
    seededArea = area;
    var n = Math.min(28, Math.max(5, Math.round(5 * area / (W * 300))));
    clouds = [];
    for (var i = 0; i < n; i++) clouds.push(newCloud(-view.exL + Math.random() * visW()));
  }

  // ---------- Bird ----------
  function drawBird(c, x, y, rot, ch, ft, sc) {
    c.save();
    c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
    c.fillStyle = ch.wing;
    c.beginPath(); c.moveTo(-10, -12); c.lineTo(-17, -20); c.lineTo(-6, -14); c.lineTo(-8, -22); c.lineTo(0, -14); c.closePath(); c.fill();
    c.fillStyle = ch.body;
    c.beginPath(); c.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); c.fill();
    c.lineWidth = 1.6; c.strokeStyle = ch.line; c.stroke();
    c.fillStyle = ch.belly;
    c.beginPath(); c.ellipse(4, 6, 11, 7, 0.1, 0, Math.PI * 2); c.fill();
    c.save();
    c.translate(-6, 2); c.rotate(Math.sin(ft) * 0.7 - 0.2);
    c.fillStyle = ch.wing;
    c.beginPath(); c.ellipse(-3, 0, 11, 6, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    c.fillStyle = ch.beak;
    c.beginPath(); c.moveTo(14, -1); c.lineTo(26, 2); c.lineTo(14, 7); c.closePath(); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(8, -6, 5.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1b1b3a';
    c.beginPath(); c.arc(9.8, -5.6, 2.6, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // ---------- Flow ----------
  function resetWorld() {
    pipes = []; parts = []; score = 0; shake = 0; isNew = false;
    bird.y = 300; bird.vy = 0; bird.rot = 0;
    cur = clonePal(PH[0]);
  }
  function startGame() {
    ensureAudio();
    D = DIFFS[store.df];
    resetWorld();
    state = 'ready';
    $('menu').hidden = true; $('pick').hidden = true; $('over').hidden = true; $('pause').hidden = true; $('pauseBtn').hidden = false;
  }
  function toMenu() {
    state = 'menu'; resetWorld();
    $('over').hidden = true; $('pause').hidden = true; $('pauseBtn').hidden = true; $('menu').hidden = false;
    refreshMenu();
  }
  function flap() {
    if (state === 'ready') state = 'play';
    if (state !== 'play') return;
    bird.vy = -FLAP;
    tone(380, 650, 0.12, 'square', 0.04);
    for (var i = 0; i < 4; i++) {
      parts.push({ x: BX - 10, y: bird.y + 4, vx: -1.2 - Math.random() * 1.2, vy: Math.random() * 1.6 - 0.4, life: 26, max: 26, col: CHARS[store.ch].belly, r: 2 + Math.random() * 1.6 });
    }
  }
  function die() {
    state = 'dead'; deadAt = performance.now(); shake = 12;
    tone(240, 50, 0.4, 'sawtooth', 0.09);
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * 6.283, s = 1.5 + Math.random() * 4;
      parts.push({ x: BX, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 42, max: 42, col: i % 2 ? CHARS[store.ch].body : CHARS[store.ch].belly, r: 2 + Math.random() * 3 });
    }
    if (score > store.best[store.df]) { store.best[store.df] = score; isNew = score > 0; }
    save();
    setTimeout(showOver, 750);
  }
  function medalOf(s) { return s >= 40 ? 4 : s >= 30 ? 3 : s >= 20 ? 2 : s >= 10 ? 1 : 0; }
  function showOver() {
    if (state !== 'dead') return;
    var m = medalOf(score), el = $('medal');
    el.className = 'medal m' + m;
    el.textContent = m ? MEDALS[m] : 'Score 10 for a bronze medal';
    $('sc').textContent = score;
    $('bs').textContent = store.best[store.df];
    $('newTag').hidden = !isNew;
    $('pauseBtn').hidden = true;
    $('over').hidden = false;
  }
  function pauseGame() {
    if (state !== 'play' && state !== 'ready') return;
    prevState = state; state = 'paused';
    $('pause').hidden = false;
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = prevState; $('pause').hidden = true;
  }

  // Pillars appear a little beyond the play field (up to 260 units on wide screens) and fade in.
  function spawnX() { return W + Math.min(view.exR, 260) + 60; }
  function spawn() {
    var lo = 92 + (D.move ? 22 : 0), hi = GY - D.gap - 92 - (D.move ? 22 : 0);
    var x = spawnX();
    pipes.push({ x: x, sx: x, base: lo + Math.random() * (hi - lo), gy: 0, ph: Math.random() * 6.28, passed: false });
  }

  // ---------- Update ----------
  function step() {
    t++;
    var tgt = PH[state === 'menu' ? 0 : Math.floor(score / 10) % 3];
    lerpPal(cur, tgt, 0.025);

    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.sp * (state === 'dead' ? 0.3 : 1);
      if (c.x < -view.exL - 90) { var n = newCloud(W + view.exR + 60); c.x = n.x; c.y = n.y; }
    }

    if (state === 'menu' || state === 'ready') {
      groundOff += 1.6;
      var cy = 300 + Math.sin(t / 14) * 9;
      bird.y = cy; bird.rot = 0; bird.flapT += 0.3;
    } else if (state === 'play') {
      var sp = D.sp + Math.min(score * 0.012, 0.7);
      groundOff += sp;
      bird.vy += GRAV; bird.y += bird.vy;
      bird.rot = Math.max(-0.45, Math.min(1.4, bird.vy * 0.075));
      bird.flapT += bird.vy < 0 ? 0.5 : 0.18;
      if (bird.y < BR) { bird.y = BR; bird.vy = 0; }
      var last = pipes[pipes.length - 1];
      if (!last || last.x < spawnX() - D.sd) spawn();
      for (var p = 0; p < pipes.length; p++) {
        var pp = pipes[p];
        pp.x -= sp;
        pp.gy = D.move ? pp.base + Math.sin(t * 0.035 + pp.ph) * 22 : pp.base;
        if (!pp.passed && pp.x + PW < BX - BR) {
          pp.passed = true; score++;
          tone(680, 1020, 0.14, 'triangle', 0.08);
        }
        if (BX + BR > pp.x + 3 && BX - BR < pp.x + PW - 3) {
          if (bird.y - BR < pp.gy || bird.y + BR > pp.gy + D.gap) { die(); break; }
        }
      }
      pipes = pipes.filter(function (q) { return q.x > -PW - 10 - view.exL; });
      if (state === 'play' && bird.y + BR >= GY) { bird.y = GY - BR; die(); }
    } else if (state === 'dead') {
      bird.vy += GRAV; bird.y += bird.vy;
      bird.rot = Math.min(1.5, bird.rot + 0.08);
      if (bird.y + BR >= GY) { bird.y = GY - BR; bird.vy = 0; }
    }

    for (var q = parts.length - 1; q >= 0; q--) {
      var pa = parts[q];
      pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.1; pa.life--;
      if (pa.life <= 0) parts.splice(q, 1);
    }
    if (shake > 0) shake *= 0.86;
    if (shake < 0.3) shake = 0;
  }

  // ---------- Draw ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function pillar(x, y, h, isTop) {
    if (h <= 0) return;
    var g = ctx.createLinearGradient(x, 0, x + PW, 0);
    g.addColorStop(0, rgb(cur.pillar)); g.addColorStop(0.45, rgb(mix(cur.pillar, [255, 255, 255], 0.2))); g.addColorStop(1, rgb(cur.pdark));
    ctx.fillStyle = g;
    ctx.fillRect(x + 5, y, PW - 10, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.13)'; ctx.lineWidth = 2;
    var yy, lim = Math.max(y, -view.exT - 20);
    ctx.beginPath();
    for (yy = (isTop ? y + h : y) + (isTop ? -30 : 30); isTop ? yy > lim : yy < y + h; yy += isTop ? -30 : 30) {
      ctx.moveTo(x + 5, yy); ctx.lineTo(x + PW - 5, yy);
    }
    ctx.stroke();
    var ch = 24, cy = isTop ? y + h - ch : y;
    ctx.fillStyle = g; rr(x, cy, PW, ch, 6); ctx.fill();
    ctx.strokeStyle = rgb(cur.pdark, 0.9); ctx.lineWidth = 2; rr(x + 1, cy + 1, PW - 2, ch - 2, 6); ctx.stroke();
  }
  function hills(off, amp, base, col, sc) {
    var x0 = -view.exL - 6, x1 = W + view.exR + 6;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x0, GY);
    for (var x = x0; x <= x1; x += 8) {
      var u = (x + off) / sc;
      ctx.lineTo(x, base - amp * (0.55 * Math.sin(u) + 0.3 * Math.sin(u * 2.3 + 1.4) + 0.15 * Math.sin(u * 4.1)));
    }
    ctx.lineTo(x1, GY); ctx.closePath(); ctx.fill();
  }
  function text(str, x, y, size, fill, stroke, align) {
    ctx.font = size + 'px "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif';
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function draw() {
    var k = view.s * view.d;
    ctx.setTransform(k, 0, 0, k, view.left * view.d, view.top * view.d);
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    var vx0 = -view.exL, vw = visW(), vy0 = -view.exT;
    var g = ctx.createLinearGradient(0, vy0, 0, GY);
    g.addColorStop(0, rgb(cur.top)); g.addColorStop(1, rgb(cur.bot));
    ctx.fillStyle = g; ctx.fillRect(vx0 - 30, vy0 - 30, vw + 60, H - vy0 + 60);

    if (cur.stars > 0.02) {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i], tw = 0.55 + 0.45 * Math.sin(t / 22 + s.p);
        ctx.fillStyle = 'rgba(255,255,255,' + (cur.stars * tw).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(vx0 + s.u * vw, vy0 + s.v * (GY - 120 - vy0), s.r, 0, 6.283); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,248,214,' + (cur.stars * 0.95).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(286, 96, 20, 0, 6.283); ctx.fill();
      ctx.fillStyle = rgb(cur.top, cur.stars);
      ctx.beginPath(); ctx.arc(294, 90, 18, 0, 6.283); ctx.fill();
    }
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.fillStyle = rgb(cur.cloud, 0.85);
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, 16 * cl.s, 0, 6.283); ctx.arc(cl.x + 18 * cl.s, cl.y - 8 * cl.s, 20 * cl.s, 0, 6.283); ctx.arc(cl.x + 40 * cl.s, cl.y, 15 * cl.s, 0, 6.283);
      ctx.rect(cl.x, cl.y, 40 * cl.s, 15 * cl.s);
      ctx.fill();
    }
    hills(groundOff * 0.15, 46, GY - 40, rgb(mix(cur.hill, cur.bot, 0.5)), 60);
    hills(groundOff * 0.35 + 80, 38, GY - 8, rgb(cur.hill), 44);

    for (var p = 0; p < pipes.length; p++) {
      var pp = pipes[p];
      ctx.globalAlpha = Math.max(0, Math.min(1, (pp.sx - pp.x) / 40));
      pillar(pp.x, vy0 - 300, pp.gy - vy0 + 300, true);
      pillar(pp.x, pp.gy + D.gap, GY - (pp.gy + D.gap), false);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = rgb(cur.ground); ctx.fillRect(vx0 - 30, GY, vw + 60, GH + 40);
    ctx.fillStyle = 'rgba(0,0,0,0.09)';
    var sx0 = -(groundOff % 28) - Math.ceil((view.exL + 40) / 28) * 28;
    for (var x = sx0; x < W + view.exR + 14; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, GY + 16); ctx.lineTo(x + 14, GY + 16); ctx.lineTo(x + 4, GY + 38); ctx.lineTo(x - 10, GY + 38); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = rgb(cur.gtop); ctx.fillRect(vx0 - 30, GY, vw + 60, 14);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(vx0 - 30, GY + 14, vw + 60, 3);

    for (var q = 0; q < parts.length; q++) {
      var pa = parts[q];
      ctx.globalAlpha = Math.max(0, pa.life / pa.max);
      ctx.fillStyle = pa.col;
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var bx = state === 'menu' ? W / 2 : BX;
    drawBird(ctx, bx, bird.y, bird.rot, CHARS[store.ch], bird.flapT, 1);

    if (state === 'play' || state === 'dead' || state === 'paused') {
      text(String(score), W / 2, 104, 64, '#fff', 'rgba(12,18,51,0.75)');
    }
    if (state === 'play' || state === 'paused' || state === 'ready') {
      text('Best ' + store.best[store.df], W - 16, 36, 20, '#fff', 'rgba(12,18,51,0.7)', 'right');
    }
    if (state === 'ready') {
      var pulse = 1 + Math.sin(t / 10) * 0.04;
      ctx.save(); ctx.translate(W / 2, 190); ctx.scale(pulse, pulse);
      text('Ready?', 0, 0, 44, '#fff', 'rgba(12,18,51,0.75)');
      ctx.restore();
      text('Tap or press Space to flap', W / 2, 232, 19, '#fff', 'rgba(12,18,51,0.75)');
    }
    ctx.restore();
  }

  // ---------- Menu ----------
  function drawPick(canvas, i, ft) {
    var pc = canvas.getContext('2d');
    pc.clearRect(0, 0, 88, 88);
    drawBird(pc, 40, 46, -0.1, CHARS[i], ft, 1.45);
  }
  function drawPreviews() {
    var sw = $('grid').children;
    for (var i = 0; i < sw.length; i++) drawPick(sw[i].querySelector('canvas'), i, 0.5);
    drawPick($('curBird'), store.ch, 0.5);
  }
  function refreshMenu() {
    var sw = $('grid').children, i;
    for (i = 0; i < sw.length; i++) sw[i].setAttribute('aria-checked', i === store.ch ? 'true' : 'false');
    $('curName').textContent = CHARS[store.ch].n;
    drawPick($('curBird'), store.ch, 0.5);
    var db = $('diffs').children;
    for (i = 0; i < db.length; i++) db[i].setAttribute('aria-checked', i === store.df ? 'true' : 'false');
    $('bestLine').textContent = 'Best (' + DIFFS[store.df].n + '): ' + store.best[store.df];
    $('snd').textContent = store.snd ? 'Sound: on' : 'Sound: off';
  }
  CHARS.forEach(function (ch, i) {
    var b = document.createElement('button');
    b.className = 'sw'; b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', ch.n);
    b.innerHTML = '<canvas width="88" height="88"></canvas><span>' + ch.n + '</span>';
    b.addEventListener('click', function () { ensureAudio(); store.ch = i; save(); refreshMenu(); });
    $('grid').appendChild(b);
  });
  $('colorBtn').addEventListener('click', function () { $('pick').hidden = false; });
  $('pickDone').addEventListener('click', function () { $('pick').hidden = true; });
  window.addEventListener('keydown', function (e) { if (e.code === 'Escape' && !$('pick').hidden) $('pick').hidden = true; });
  DIFFS.forEach(function (d, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'radio'); b.textContent = d.n;
    b.addEventListener('click', function () { store.df = i; D = DIFFS[i]; save(); refreshMenu(); });
    $('diffs').appendChild(b);
  });
  $('snd').addEventListener('click', function () { store.snd = !store.snd; save(); ensureAudio(); refreshMenu(); });
  $('play').addEventListener('click', startGame);
  $('again').addEventListener('click', startGame);
  $('toMenu').addEventListener('click', toMenu);
  $('quit').addEventListener('click', toMenu);
  $('resume').addEventListener('click', resumeGame);
  $('pauseBtn').addEventListener('click', function (e) { e.stopPropagation(); pauseGame(); });

  // Full-screen dimming behind the cards, so it also covers the sky around the play field.
  function syncDim() {
    var a = !$('pick').hidden ? 0.84 : (!$('over').hidden || !$('pause').hidden) ? 0.6 : 0;
    dim.style.background = a
      ? 'rgba(6,9,30,' + a + ')'
      : !$('menu').hidden
        ? 'linear-gradient(rgba(8,12,38,0.45), rgba(8,12,38,0) 40%, rgba(8,12,38,0) 55%, rgba(8,12,38,0.55))'
        : 'none';
  }
  if (window.MutationObserver) new MutationObserver(syncDim).observe(stage, { attributes: true, attributeFilter: ['hidden'], subtree: true });
  syncDim();

  // ---------- Input (the whole screen is the tap area) ----------
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); ensureAudio(); flap(); });
  window.addEventListener('keydown', function (e) {
    var k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') {
      if (state === 'ready' || state === 'play') { e.preventDefault(); ensureAudio(); flap(); }
      else if (state === 'dead' && performance.now() - deadAt > 900 && !$('over').hidden) { e.preventDefault(); startGame(); }
    } else if (k === 'KeyP' || k === 'Escape') {
      if (state === 'paused') resumeGame(); else pauseGame();
    } else if (k === 'Enter' && state === 'menu' && document.activeElement === document.body) {
      startGame();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  // ---------- Size ----------
  // The play field is scaled to fit the screen and sits on the bottom edge; everything else is sky.
  var fitKey = '';
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    // Limit the pixel count so big screens do not render more than the GPU can keep at 60 fps.
    var d = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2500000 / (vw * vh))));
    var key = vw + 'x' + vh + '@' + d.toFixed(2);
    if (key === fitKey) return;
    fitKey = key;
    var s = Math.max(0.3, Math.min(vw / W, vh / H));
    var sw = Math.floor(W * s), sh = Math.floor(H * s);
    var left = Math.floor((vw - sw) / 2), top = vh - sh;
    stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
    stage.style.left = left + 'px'; stage.style.top = top + 'px';
    stage.style.fontSize = (s * 10) + 'px';
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    cv.width = Math.round(vw * d); cv.height = Math.round(vh * d);
    view.s = sw / W; view.d = cv.width / vw;
    view.left = left; view.top = top;
    view.exL = left / view.s; view.exR = (vw - left - sw) / view.s; view.exT = top / view.s;
    seedClouds();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);

  // ---------- Start ----------
  var last = performance.now(), acc = 0, STEP = 1000 / 60;
  function loop(now) {
    var dt = Math.min(50, now - last); last = now;
    if (state !== 'paused') {
      acc += dt;
      while (acc >= STEP) { step(); acc -= STEP; }
    } else { acc = 0; }
    draw();
    requestAnimationFrame(loop);
  }
  fit(); drawPreviews(); refreshMenu();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawPreviews(); });
  requestAnimationFrame(loop);
})();
</script>

</body></html>
